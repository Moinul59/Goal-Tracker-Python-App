version: "3.9"

services:
  app1:
    image: goal_tracker_app:1.0
    container_name: goaltracker_app1
    ports:
      - "8001:8000"
    environment:
      - INSTANCE_NAME=app1
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  app2:
    image: goal_tracker_app:1.0
    container_name: goaltracker_app2
    ports:
      - "8002:8000"
    environment:
      - INSTANCE_NAME=app2
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  app3:
    image: goal_tracker_app:1.0
    container_name: goaltracker_app3
    ports:
      - "8003:8000"
    environment:
      - INSTANCE_NAME=app3
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"

  db:
    image: postgres:16
    restart: always
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  pgdata:
