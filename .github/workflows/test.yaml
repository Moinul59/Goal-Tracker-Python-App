name: Test Project
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: action/checkout@v6

    - name: Setup python
      uses: action/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest
