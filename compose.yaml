services:
  web:
    build:
      context: .
    container_name: goal-tracker-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INSTANCE_NAME: web
      FLASK_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - backend

  worker:
    build:
      context: .
    container_name: goal-tracker-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command:
      [
        "celery",
        "-A",
        "celery_app.celery",
        "worker",
        "--loglevel=info"
      ]
    depends_on:
      - db
      - redis
    networks:
      - backend

  db:
    image: postgres:16
    container_name: goal-tracker-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: goal-tracker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: goal-tracker-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./flaskr/static:/var/www/flaskr/static:ro
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata: