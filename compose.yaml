# Docker Compose file using a pre-built image hosted on Docker Hub

services:
  web:
    image: moinul46/goal-tracker-app:1.0
    container_name: goal-tracker-app
    restart: always
    env_file:
      - .env
    environment:
      - INSTANCE_NAME=app
      - FLASK_ENV=dev
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - backend

  worker:
    image: moinul46/goal-tracker-app:1.0
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: ["celery", "-A", "celery_app.celery", "worker", "--loglevel=info"]
    networks:
      - backend

  db:
    image: postgres:16
    container_name: postgresql
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:
